# =============================================================================
# SonarCloud Configuration - Task Manager (Backend + Frontend)
# =============================================================================
sonar.projectKey=Imizrachim_final-CICD
sonar.organization=imizrachim
sonar.projectName=Task Manager CI/CD
sonar.projectVersion=1.0.0

# Rutas de codigo fuente y pruebas
sonar.sources=backend/app,frontend/src
sonar.tests=backend/tests,frontend/src/test
sonar.test.inclusions=backend/tests/**/*.py,frontend/src/test/**/*.test.ts,frontend/src/test/**/*.test.tsx
sonar.sourceEncoding=UTF-8

# Exclusiones generales y de cobertura
sonar.exclusions=**/node_modules/**,**/dist/**,**/htmlcov/**,**/coverage/**,**/__pycache__/**,**/venv/**,**/.venv/**,frontend/src/test/**
sonar.coverage.exclusions=backend/tests/**,backend/app/__init__.py,backend/app/routers/__init__.py,frontend/src/test/**,frontend/src/main.tsx,frontend/src/types/**,frontend/src/vite-env.d.ts

# Configuracion de Python (Backend)
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.pylint.reportPaths=pylint-report.txt
sonar.python.flake8.reportPaths=flake8-report.txt

# Configuracion de TypeScript / React (Frontend)
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Quality Gate para CI/CD
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
