name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Black (Formatter)
        run: black --check backend

      - name: Run Pylint (Linter)
        run: pylint backend/app --exit-zero --output-format=text > pylint-report.txt

      - name: Run Flake8 (Linter)
        run: flake8 backend/app --exit-zero --output-file=flake8-report.txt

      - name: Run Backend Unit and Integration Tests (Coverage >= 80%)
        run: pytest --cov-fail-under=80

      - name: Run Frontend Tests and Build
        working-directory: frontend
        run: |
          npm run typecheck
          npm run test:coverage
          npm run build

      - name: Prepare Docker Image Names
        id: image_names
        run: |
          DOCKER_USER=$(echo "${{ vars.DOCKERHUB_USERNAME }}" | tr '[:upper:]' '[:lower:]')
          echo "backend_image=${DOCKER_USER}/final-cicd-backend" >> "$GITHUB_OUTPUT"
          echo "frontend_image=${DOCKER_USER}/final-cicd-frontend" >> "$GITHUB_OUTPUT"

      - name: Build Docker Images
        run: |
          docker build -t "${{ steps.image_names.outputs.backend_image }}:${{ github.sha }}" ./backend
          docker build -t "${{ steps.image_names.outputs.frontend_image }}:${{ github.sha }}" ./frontend

      - name: Start Services with Docker Compose
        run: |
          docker compose up -d
          timeout 60 bash -c 'until curl -sf http://localhost:8000/health > /dev/null; do sleep 2; done'
          timeout 30 bash -c 'until curl -sf http://localhost:3000/health > /dev/null; do sleep 1; done'

      - name: Run Acceptance Tests (Selenium E2E)
        env:
          FRONTEND_URL: http://localhost:3000
          BACKEND_URL: http://localhost:8000
          SELENIUM_HEADLESS: 'true'
        run: pytest backend/tests/acceptance --no-cov --html=acceptance-report.html --self-contained-html

      - name: Show Container Logs on Failure
        if: failure()
        run: docker compose logs || true

      - name: Stop Docker Compose Services
        if: always()
        run: docker compose down -v || true

      - name: Upload Test Reports Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            htmlcov/
            report.html
            acceptance-report.html
            coverage.xml
            frontend/coverage/
            pylint-report.txt
            flake8-report.txt

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker Images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          BACKEND_IMG="${{ steps.image_names.outputs.backend_image }}"
          FRONTEND_IMG="${{ steps.image_names.outputs.frontend_image }}"

          docker tag "${BACKEND_IMG}:${{ github.sha }}" "${BACKEND_IMG}:latest"
          docker push "${BACKEND_IMG}:${{ github.sha }}"
          docker push "${BACKEND_IMG}:latest"

          docker tag "${FRONTEND_IMG}:${{ github.sha }}" "${FRONTEND_IMG}:latest"
          docker push "${FRONTEND_IMG}:${{ github.sha }}"
          docker push "${FRONTEND_IMG}:latest"
