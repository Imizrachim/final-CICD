[pytest]
pythonpath = backend
addopts = -v --color=yes --tb=short --cov=app --cov-fail-under=80 --cov-report=term-missing --cov-report=html --cov-report=xml --cov-branch --html=report.html --self-contained-html
testpaths = backend/tests/unit backend/tests/integration
markers =
    unit: Pruebas unitarias del backend
    integration: Pruebas de integracion con la base de datos
    acceptance: Pruebas de aceptacion E2E con Selenium
    smoke: Pruebas smoke posdespliegue
norecursedirs = .git .venv venv env .* _* build dist htmlcov .github node_modules frontend
